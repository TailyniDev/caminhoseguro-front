<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16063f"/>
      <stop offset="0.55" stop-color="#32106f"/>
      <stop offset="1" stop-color="#5b20b8"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8d4dff"/>
      <stop offset="1" stop-color="#32106f"/>
    </linearGradient>
    <linearGradient id="city" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c18aff"/>
      <stop offset="1" stop-color="#6634c7"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect x="10" y="10" width="492" height="492" rx="88" fill="url(#bg)"/>
  <rect x="15" y="15" width="482" height="482" rx="83" fill="none" stroke="#b15cff" stroke-width="10"/>

  <!-- city -->
  <g opacity="0.95" fill="url(#city)">
    <rect x="54" y="255" width="62" height="155" rx="5"/>
    <rect x="103" y="210" width="76" height="200" rx="5"/>
    <rect x="168" y="272" width="65" height="138" rx="5"/>
    <rect x="338" y="252" width="61" height="158" rx="5"/>
    <rect x="386" y="205" width="72" height="205" rx="5"/>
    <rect x="431" y="278" width="39" height="132" rx="5"/>
  </g>
  <g fill="#eadcff" opacity="0.9">
    <path d="M76 282h14v18H76zm25 0h14v18h-14zM76 315h14v18H76zm25 0h14v18h-14z"/>
    <path d="M126 237h15v19h-15zm27 0h15v19h-15zM126 270h15v19h-15zm27 0h15v19h-15zM126 303h15v19h-15zm27 0h15v19h-15z"/>
    <path d="M356 280h14v18h-14zm25 0h14v18h-14zM356 314h14v18h-14zm25 0h14v18h-14z"/>
    <path d="M406 232h15v19h-15zm27 0h15v19h-15zM406 267h15v19h-15zm27 0h15v19h-15zM406 302h15v19h-15zm27 0h15v19h-15z"/>
  </g>

  <!-- greenery -->
  <g fill="#55b59c">
    <circle cx="65" cy="398" r="42"/><circle cx="108" cy="390" r="47"/>
    <circle cx="164" cy="398" r="38"/><circle cx="343" cy="397" r="43"/>
    <circle cx="395" cy="390" r="48"/><circle cx="449" cy="401" r="38"/>
  </g>
  <g fill="#398775" opacity="0.9">
    <circle cx="91" cy="410" r="30"/><circle cx="139" cy="413" r="27"/>
    <circle cx="373" cy="414" r="31"/><circle cx="427" cy="415" r="29"/>
  </g>

  <!-- road -->
  <path d="M35 472 C150 420 226 414 300 389 C355 370 411 364 478 392 L478 470 C401 438 344 446 286 463 C202 488 112 497 35 501Z" fill="#12082f"/>
  <path d="M35 472 C150 420 226 414 300 389 C355 370 411 364 478 392" fill="none" stroke="#a86cff" stroke-width="7"/>
  <path d="M93 474 l63 -14 29 7 -65 18zM230 441 l51 -14 27 5 -52 16zM359 404 l39 -5 24 8 -40 8z" fill="#fff" opacity="0.95"/>

  <!-- accessibility symbol -->
  <g fill="#fff" stroke="#17083d" stroke-width="8" stroke-linejoin="round">
    <circle cx="122" cy="343" r="18"/>
    <path d="M119 363h43c10 0 18 7 18 17s-8 17-18 17h-22l-5 28 27 31c6 7 5 17-2 23s-17 5-23-2l-34-39c-5-6-7-13-5-20l8-30-27-1c-10 0-18-8-18-18s8-18 18-18z"/>
    <path d="M131 390l-8 49 31 31" fill="none"/>
  </g>

  <!-- main location pin -->
  <path d="M258 78 C190 78 145 128 145 188 C145 266 258 356 258 356 C258 356 371 266 371 188 C371 128 326 78 258 78Z" fill="url(#pin)" stroke="#eadcff" stroke-width="8" filter="url(#glow)"/>
  <circle cx="258" cy="188" r="76" fill="#35117a"/>

  <!-- shield -->
  <path d="M258 124 L307 142 V184 C307 218 284 239 258 252 C232 239 209 218 209 184 V142Z" fill="#fff"/>
  <path d="M232 184 l18 18 38-40" fill="none" stroke="#35117a" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- alert rays -->
  <g stroke="#e8bfff" stroke-width="12" stroke-linecap="round">
    <path d="M344 86l13-27"/><path d="M372 101l24-21"/><path d="M387 127l30-8"/>
  </g>

  <!-- flood and light indicators -->
  <g fill="#fff" stroke="#5b20b8" stroke-width="6">
    <rect x="374" y="154" width="83" height="67" rx="22"/>
    <rect x="389" y="255" width="83" height="67" rx="22"/>
  </g>
  <g fill="#35117a">
    <path d="M416 169c-8 13-15 20-15 29a15 15 0 0 0 30 0c0-9-7-16-15-29z"/>
    <path d="M396 207c10-8 20 5 30-3 10-8 20 5 30-3" fill="none" stroke="#35117a" stroke-width="5" stroke-linecap="round"/>
    <path d="M407 273h34v9h-34zM413 282v22h22v-22z"/>
    <path d="M443 286l10 4M443 298l10 4M404 286l-10 4M404 298l-10 4" stroke="#35117a" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
